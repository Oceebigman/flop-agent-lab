<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><title>FLOP Agent Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#0e1119;color:#f1f4fb;font:16px/1.55 system-ui}main{max-width:1080px;margin:auto;padding:56px 22px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:28px}h1{font-size:clamp(42px,8vw,76px);letter-spacing:-.07em;margin:0;line-height:1.1}h2{margin:0;font-size:21px}p{margin:8px 0;color:#b7c2d7}small{color:#a6b6d0}.tag{color:#ffd39c;font-weight:650}button,.file{font:inherit;color:#141621;background:#ffd39c;padding:12px 18px;border:0;border-radius:10px;font-weight:650;cursor:pointer}button:disabled{opacity:.65}.grid{display:grid;grid-template-columns:1fr 1.35fr;gap:16px}section{background:#171d2a;border:1px solid #323d54;border-radius:16px;padding:22px;min-width:0}.report{grid-column:1/-1}ul{padding:0;list-style:none}li{padding:8px 0;border-bottom:1px solid #323d54;overflow-wrap:anywhere}output{display:block;margin-top:12px;overflow-wrap:anywhere}input{max-width:100%;margin-top:8px;font:inherit}input::file-selector-button{background:#26324a;color:white;font:inherit;border:0;padding:8px 12px;border-radius:8px;margin-right:8px}@media(max-width:640px){.grid{grid-template-columns:1fr}main{padding-top:30px}}
header{padding:24px 0;border-bottom:1px solid #323d54}body{background:radial-gradient(ellipse at top right,#202d45,transparent 58%),#0e1119}section{position:relative;overflow:hidden}section:before{content:"";position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,#ffd39c,transparent);opacity:.4}#health{font-family:monospace;color:#ffd39c}.scan{display:block;width:130px;height:3px;margin:12px 0;background:#323d54;overflow:hidden}.scan:after{content:"";display:block;width:30%;height:100%;background:#ffd39c;animation:scan 1.2s ease-in-out infinite alternate}.scan[hidden]{display:none}@keyframes scan{to{transform:translateX(235%)}}@media(prefers-reduced-motion:reduce){.scan:after{animation:none}}#health[data-state=ok]{color:#71f5b0}#health[data-state=degraded]{color:#ffd39c}#health[data-state=error]{color:#ff969f}#health[data-state=checking],#health[data-state=unknown]{color:#b7c2d7}.scan:after{background:#71f5b0}#refresh{background:#71f5b0}</style><main><header><div><small class="tag">INDEPENDENT FLOP DEVNET TOOL</small><h1>FLOP Agent Lab</h1><p>Check the gateway, browse models, and read your request receipt.</p></div><button id="refresh">Refresh checks</button></header><div class="grid"><section><h2>Gateway status</h2><span id="scan" class="scan" hidden aria-hidden="true"></span><p id="health" role="status"></p><small id="health-time"></small></section><section><h2>Listed models</h2><p id="catalog" role="status"></p><ul id="models"></ul><small id="catalog-time"></small></section><section class="report"><h2>Request receipt</h2><p>Choose a JSON report from the local runner. Your browser reads it on this device.</p><label for="report">Runner report</label><br><input type="file" id="report" accept=".json,application/json"><output id="receipt" aria-live="polite">No report selected.</output></section></div></main><script src="/app.js"></script></html>
